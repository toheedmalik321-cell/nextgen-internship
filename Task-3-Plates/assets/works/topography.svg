<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="pl05t" aria-describedby="pl05d">
  <title id="pl05t">Topography</title>
  <desc id="pl05d">Abstract plate: seventeen concentric contour rings of increasing radius, distorted by a turbulence displacement so they read as hand-drawn relief, every fourth ring promoted to a heavier gold index contour, annotated with elevation labels and closed by a gold summit triangle at the centre.</desc>
  <defs>
  <filter id="grain" x="0" y="0" width="1200" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="4" seed="31" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.949 0 0 0 0 0.937 0 0 0 0 0.910 0.9 0 0 0 -0.34"/>
  </filter>
  <radialGradient id="vig" cx="600" cy="440" r="820" gradientUnits="userSpaceOnUse">
    <stop offset="0.45" stop-color="#0A0B0C" stop-opacity="0"/>
    <stop offset="1" stop-color="#0A0B0C" stop-opacity="0.62"/>
  </radialGradient>
  <filter id="relief" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.0055 0.008" numOctaves="3" seed="5" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="40" xChannelSelector="R" yChannelSelector="G"/>
  </filter></defs>
  <rect width="1200" height="900" fill="#0A0B0C"/>
<g filter="url(#relief)">
