  <title id="pl04t">Strata</title>
  <desc id="pl04d">Abstract plate: eleven horizontal sedimentary bands of varying tone and thickness stacked across a near-black ground, their seams roughened by a turbulence displacement, one band marked in clay orange, with three fossil ellipse outlines and a depth scale down the left edge.</desc>
