  <title id="pl16t">Dot Matrix Face</title>
  <desc id="pl16d">Abstract plate: a portrait rendered as a matrix of circular dots on a fifteen by eleven grid. Dot radius is driven by a key light from the upper left, with darkened eye sockets, a bright brow bar, a highlighted nose ridge, a shadowed mouth, an acid core on the lit cheek, and a cyan rim light picking out the right contour of the skull.</desc>
