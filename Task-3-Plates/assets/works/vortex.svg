<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="pl15t" aria-describedby="pl15d">
  <title id="pl15t">Vortex</title>
  <desc id="pl15d">Abstract plate: twenty-four narrow triangular wedges spiralling clockwise around an off-centre origin, alternating in opacity to read as a pinwheel, with one acid wedge marking the twelve o'clock position, a cyan counter-rotating ring outside them, and a small solid core.</desc>
  <defs>
  <filter id="grain" x="0" y="0" width="1200" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="4" seed="13" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.949 0 0 0 0 0.937 0 0 0 0 0.910 0.9 0 0 0 -0.34"/>
  </filter>
  <radialGradient id="vig" cx="600" cy="450" r="820" gradientUnits="userSpaceOnUse">
    <stop offset="0.45" stop-color="#0A0B0C" stop-opacity="0"/>
    <stop offset="1" stop-color="#0A0B0C" stop-opacity="0.62"/>
  </radialGradient>
  <radialGradient id="bloom" cx="560" cy="410" r="300" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#C9F24B" stop-opacity="0.20"/>
    <stop offset="1" stop-color="#C9F24B" stop-opacity="0"/>
  </radialGradient>
  <path id="wedge" d="M560 450 L596 214 L632 450 Z"/>
  <path id="sliver" d="M600 450 L614 300 L628 450 Z"/></defs>
  <rect width="1200" height="900" fill="#0A0B0C"/>
  <circle cx="560" cy="450" r="300" fill="url(#bloom)"/>
  <g stroke="#24282D" stroke-width="1.1" fill="none">
