    <use href="#wedge" transform="rotate(315 560 450)" opacity="0.30"/>
    <use href="#wedge" transform="rotate(330 560 450)" opacity="0.68"/>
    <use href="#wedge" transform="rotate(345 560 450)" opacity="0.22"/>
