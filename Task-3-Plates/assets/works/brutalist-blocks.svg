<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="pl02t" aria-describedby="pl02d">
  <title id="pl02t">Brutalist Blocks</title>
  <desc id="pl02d">Abstract plate: nine offset rectangular slabs outlined in thin warm-white lines and layered over one another on a near-black ground, their edges roughened by a turbulence displacement, pierced by a single solid acid-lime bar running horizontally through the composition.</desc>
  <defs>
  <filter id="grain" x="0" y="0" width="1200" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="4" seed="31" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.949 0 0 0 0 0.937 0 0 0 0 0.910 0.9 0 0 0 -0.34"/>
  </filter>
  <radialGradient id="vig" cx="600" cy="440" r="820" gradientUnits="userSpaceOnUse">
    <stop offset="0.45" stop-color="#0A0B0C" stop-opacity="0"/>
    <stop offset="1" stop-color="#0A0B0C" stop-opacity="0.62"/>
  </radialGradient>
  <filter id="warp" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.014 0.02" numOctaves="3" seed="11" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="9" xChannelSelector="R" yChannelSelector="G"/>
  </filter></defs>
  <rect width="1200" height="900" fill="#0A0B0C"/>
<g filter="url(#warp)">
  <rect x="96" y="176" width="392" height="262" fill="none" stroke="#F2EFE8" stroke-width="2" opacity="0.55"/>
  <rect x="300" y="300" width="300" height="300" fill="none" stroke="#F2EFE8" stroke-width="2" opacity="0.3"/>
  <rect x="96" y="176" width="392" height="130" fill="none" stroke="#F2EFE8" stroke-width="2" opacity="0.14"/>
  <rect x="452" y="606" width="520" height="190" fill="none" stroke="#F2EFE8" stroke-width="2" opacity="0.4"/>
  <rect x="640" y="120" width="460" height="300" fill="none" stroke="#F2EFE8" stroke-width="2" opacity="0.22"/>
  <rect x="820" y="250" width="284" height="336" fill="none" stroke="#F2EFE8" stroke-width="2" opacity="0.5"/>
  <rect x="140" y="560" width="260" height="240" fill="none" stroke="#F2EFE8" stroke-width="2" opacity="0.18"/>
  <rect x="600" y="470" width="200" height="120" fill="none" stroke="#F2EFE8" stroke-width="2" opacity="0.34"/>
  <rect x="972" y="560" width="132" height="244" fill="none" stroke="#F2EFE8" stroke-width="2" opacity="0.6"/>
</g>
<rect x="300" y="546" width="672" height="86" fill="#C9F24B"/>
<path d="M96 700h1008" stroke="#F2EFE8" stroke-width="1" opacity="0.3"/>
<path d="M60 176L1140 806" stroke="#F2EFE8" stroke-width="1" stroke-dasharray="3 13" opacity="0.4"/>
<g fill="none" stroke="#F2EFE8" stroke-width="1.6" opacity="0.55">
  <path d="M28 62V28h34 M1138 28h34v34 M1172 838v34h-34 M62 872H28v-34"/>
</g>
<rect x="28" y="28" width="1144" height="844" fill="none" stroke="#F2EFE8" stroke-width="1" opacity="0.14"/>
<text x="76" y="872" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="19" letter-spacing="3.4" font-weight="400" fill="#F2EFE8" opacity="0.42">MASS / 09 SLABS</text>
  <rect width="1200" height="900" fill="url(#vig)"/>
