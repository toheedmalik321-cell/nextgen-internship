<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>To-Do List cover</title>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0v64" fill="none" stroke="#24282D" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="#171A1D"/>
  <rect width="800" height="500" fill="url(#grid)" opacity=".45"/>

  <!-- ghost tick behind the stack -->
  <path d="M470 400l60 62 132-176" fill="none" stroke="#C9F24B" stroke-width="14" stroke-linecap="butt" opacity=".08"/>

  <g fill="#101214" stroke="#24282D" stroke-width="2">
    <rect x="90" y="112" width="620" height="54"/>
    <rect x="90" y="182" width="620" height="54"/>
    <rect x="90" y="252" width="620" height="54"/>
    <rect x="90" y="322" width="620" height="54"/>
  </g>

  <g fill="#101214" stroke="#5C636B" stroke-width="2">
    <rect x="112" y="126" width="26" height="26"/>
    <rect x="112" y="196" width="26" height="26"/>
    <rect x="112" y="266" width="26" height="26"/>
    <rect x="112" y="336" width="26" height="26"/>
  </g>

  <!-- first task is done -->
  <rect x="112" y="126" width="26" height="26" fill="#C9F24B"/>
  <path d="M117 140l6 7 11-15" fill="none" stroke="#0A0B0C" stroke-width="3.5" stroke-linecap="butt"/>
  <rect x="156" y="136" width="250" height="7" fill="#5C636B"/>

  <!-- second task is in progress: active chip -->
  <rect x="112" y="196" width="26" height="26" fill="none" stroke="#C9F24B" stroke-width="2"/>
  <rect x="116" y="200" width="18" height="18" fill="#C9F24B" opacity=".45"/>
  <rect x="156" y="206" width="320" height="7" fill="#C9F24B"/>
  <g fill="none" stroke="#8FB52F" stroke-width="2">
    <path d="M620 190h78v38h-78z"/>
  </g>
  <rect x="620" y="190" width="78" height="38" fill="#C9F24B" opacity=".12"/>
  <g fill="#C9F24B">
    <rect x="632" y="205" width="5" height="8"/>
    <rect x="642" y="205" width="5" height="8"/>
    <rect x="652" y="205" width="5" height="8"/>
    <rect x="662" y="205" width="5" height="8"/>
    <rect x="672" y="205" width="5" height="8"/>
    <rect x="682" y="205" width="5" height="8"/>
  </g>

  <!-- remaining tasks -->
  <g fill="#5C636B">
    <rect x="156" y="276" width="230" height="7"/>
    <rect x="156" y="346" width="290" height="7"/>
  </g>

  <!-- completion meter -->
  <rect x="90" y="412" width="620" height="8" fill="#101214" stroke="#24282D" stroke-width="2"/>
  <rect x="92" y="414" width="370" height="4" fill="#C9F24B"/>
  <g fill="#9AA1A9">
    <rect x="90" y="436" width="88" height="5" opacity=".5"/>
    <rect x="190" y="436" width="46" height="5" opacity=".3"/>
    <rect x="640" y="432" width="70" height="13"/>
  </g>

  <rect width="800" height="500" filter="url(#grain)" opacity=".05"/>
</svg>